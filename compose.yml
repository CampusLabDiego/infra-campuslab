services:

  mysql:
    image: mysql:8.4
    container_name: campuslab-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "13306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql


  catalog:
    build:
      context: ../ms-campuslab-catalog

    container_name: campuslab-catalog
    restart: unless-stopped

    depends_on:
      - mysql

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: campuslab_catalog
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "8081:8081"


  bookings:
    build:
      context: ../ms-campuslab-bookings

    container_name: campuslab-bookings
    restart: unless-stopped

    depends_on:
      - mysql

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: campuslab_bookings
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "8082:8082"


  bff:
    build:
      context: ../ms-campuslab-bff

    container_name: campuslab-bff
    restart: unless-stopped

    depends_on:
      - catalog
      - bookings

    ports:
      - "8080:8080"


volumes:
  mysql_data:
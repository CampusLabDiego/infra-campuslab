services:

  mysql:
    image: mysql:8.4
    container_name: campuslab-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "13306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  catalog:
    build:
      context: ../ms-campuslab-catalog

    container_name: campuslab-catalog
    restart: unless-stopped

    depends_on:
      - mysql

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: campuslab_catalog
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

      RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES:-172.31.45.233:5672,172.31.45.233:5673}
      RABBITMQ_USER: ${RABBITMQ_USER:?Falta configurar RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Falta configurar RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: campuslab

    expose:
      - "8081"

  bookings:
    build:
      context: ../ms-campuslab-bookings

    container_name: campuslab-bookings
    restart: unless-stopped

    depends_on:
      - mysql

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: campuslab_bookings
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

      CATALOG_URL: http://catalog:8081

      RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES:-172.31.45.233:5672,172.31.45.233:5673}
      RABBITMQ_USER: ${RABBITMQ_USER:?Falta configurar RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Falta configurar RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: campuslab

    expose:
      - "8082"

  notifier:
    build:
      context: ../ms-campuslab-notifier

    container_name: campuslab-notifier
    restart: unless-stopped

    depends_on:
      - mysql

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: campuslab_notifier
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

      RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES:-172.31.45.233:5672,172.31.45.233:5673}
      RABBITMQ_USER: ${RABBITMQ_USER:?Falta configurar RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Falta configurar RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: campuslab

      MAIL_HOST: ${MAIL_HOST:?Falta configurar MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?Falta configurar MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Falta configurar MAIL_PASSWORD}
      MAIL_TEST_RECIPIENT: ${MAIL_TEST_RECIPIENT:-}
      MAIL_FROM: ${MAIL_FROM:?Falta configurar MAIL_FROM}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_STARTTLS_REQUIRED: ${MAIL_STARTTLS_REQUIRED:-true}

      DOCUMENTS_PATH: /app/storage

    expose:
      - "8083"

    volumes:
      - notifier_documents:/app/storage

    mem_limit: 512m
    memswap_limit: 1g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rabbit-admin:
    build:
      context: ../ms-campuslab-rabbit-admin

    container_name: campuslab-rabbit-admin
    restart: unless-stopped

    environment:
      RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES:-172.31.45.233:5672,172.31.45.233:5673}
      RABBITMQ_USER: ${RABBITMQ_USER:?Falta configurar RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Falta configurar RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: campuslab

    expose:
      - "8084"

    mem_limit: 384m
    memswap_limit: 768m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bff:
    build:
      context: ../ms-campuslab-bff

    container_name: campuslab-bff
    restart: unless-stopped

    depends_on:
      - catalog
      - bookings
      - notifier
      - rabbit-admin

    ports:
      - "8080:8080"

    environment:
      CATALOG_URL: http://catalog:8081
      BOOKINGS_URL: http://bookings:8082
      NOTIFIER_URL: http://notifier:8083
      RABBIT_ADMIN_URL: http://rabbit-admin:8084

      SPRING_APPLICATION_JSON: >-
        {"campuslab":{"security":{"allowed-origins":"http://localhost:4200,https://wktaaga6j4.execute-api.us-east-1.amazonaws.com"}}}

  frontend:
    build:
      context: ../frontend-campuslab

    container_name: campuslab-frontend
    restart: unless-stopped

    depends_on:
      - bff

    ports:
      - "4200:80"

volumes:
  mysql_data:
  notifier_documents:
# Nombre del cluster
cluster_name = campuslab-rabbitmq

# Descubrimiento de los dos nodos
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Puerto para las conexiones de los microservicios
listeners.tcp.default = 5672

# Panel de administracion
management.tcp.port = 15672

# Umbral de memoria por nodo.
# Al alcanzarlo, RabbitMQ frena a los publicadores.
vm_memory_high_watermark.absolute = 384MiB

# Espacio libre minimo para aceptar publicaciones
disk_free_limit.absolute = 1GB

# Registro de eventos en la salida del contenedor
log.console = true
log.console.level = info
log.file = false